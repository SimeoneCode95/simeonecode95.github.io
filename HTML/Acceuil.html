<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AuSpot Burger & Sandwich</title>
    <link href="../CSS/Acceuil.css" rel="stylesheet">
</head>
<body>
    <!-- Menu Déroulant -->
    <div class="deroulant">
     <button class="hamburger">
        &#9776;  <!-- Symbole hamburger -->
     </button>
    <div class="contenu">
        <a href="Acceuil.html">Acceuil</a>
        <a href="Menu.html">Menu</a>
        <a href="Contact.html">Contact</a>
        <a href="Cariere.html">Carrières</a>
    </div>
    </div>

       <!-- Galerie Slider -->
<div class="gallery-section">
    <h2 class="gallery-title">Découvrez Au Spot</h2>
    
    <div class="slider-container">
        <div class="slider" id="imageSlider">
            <img src="../Images/PhotoGallery1.jpg" alt="AuSpot Intérieur" class="slide">
            <img src="../Images/PhotoGallery2.jpg" alt="Nos Burgers" class="slide">
            <img src="../Images/PhotoGallery3.jpg" alt="Ambiance Restaurant" class="slide">
            <img src="../Images/PhotoGallery4.jpg" alt="Sandwichs Signature" class="slide">
            <img src="../Images/PhotoGallery5.jpg" alt="Équipe AuSpot" class="slide">
        </div>
        
        <!-- Flèches -->
        <button class="prev-btn">❮</button>
        <button class="next-btn">❯</button>
    </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
    <span class="close-btn">&times;</span>
    <img id="lightbox-image" src="" alt="">
</div>

    <!-- Icones livraison & réseaux -->
    <div class="social-icons">
        <div class="UberEats">
          <a href="https://www.ubereats.com/ca-fr/store/au-spot/GgPig4UMUm-5xfinzkaRMQ?srsltid=AfmBOop9cFQso7bI9QPVhzvus9bj1gnhBaCya9CnWB0teZhFqC57pcik" target="_blank"><img src="../Images/UberEats.png" alt="UberEats"></a>
        </div>
        <div class="DoorDash">
          <a href="https://www.doordash.com/store/au-spot-montréal-31462001/45238346/?srsltid=AfmBOooGSD-Zgb08hky5FV7DkGODWGH94eTP7LjxGbRzyGEAzuVG2XaK" target="_blank"><img src="../Images/DoorDash.png" alt="DoorDash"></a>
        </div>
        <div class="SkipTheDishes">
          <a href="https://www.skipthedishes.com/fr/au-spot-rue-saint-hubert?serviceType=collection&utm_source=google&utm_medium=organic&utm_campaign=foodorder" target="_blank"><img src="../Images/Skip.jpeg" alt="SkipTheDishes"></a>
        </div>
        <div class="Instagram">
          <a href="https://www.instagram.com/auspot2024/" target="_blank"><img src="../Images/Instagram.png" alt="Instagram"></a>
        </div>
        <div class="TikTok">
          <a href="https://www.tiktok.com/discover/au-spot-montreal" target="_blank"><img src="../Images/TikTok.png" alt="TikTok"></a>
        </div>
    </div>
    <script>
    const slider = document.getElementById('imageSlider');
    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;

    function moveSlider() {
        slider.style.transform = `translateX(-${currentIndex * 100}%)`;
    }

    document.querySelector('.next-btn').addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % slides.length;
        moveSlider();
    });

    document.querySelector('.prev-btn').addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        moveSlider();
    });

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const closeBtn = document.querySelector('.close-btn');

    slides.forEach(slide => {
        slide.addEventListener('click', () => {
            lightboxImage.src = slide.src;
            lightbox.style.display = 'flex';
        });
    });

    closeBtn.addEventListener('click', () => {
        lightbox.style.display = 'none';
    });

    // Fermer en cliquant en dehors de l'image
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
            lightbox.style.display = 'none';
        }
    });
</script>
</body>
</html>
